name: 其他问题
description: 不是 bug、也不是功能建议的问题（安装、兼容性、用法疑问）
title: "[Question] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        用法问题请先看 [README](https://github.com/yhjes2019/pulsewright#readme) 的 FAQ 与[已知限制](https://github.com/yhjes2019/pulsewright#已知限制)。装不上、分数不对、热力图空白，多半那里有答案。

  - type: textarea
    id: question
    attributes:
      label: 你的问题
      description: 尽量具体。写清「我做了什么、期望什么、实际什么」。
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: 插件版本
      placeholder: "1.0.0"

  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian 版本
      placeholder: "1.15.0"

  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - Windows
        - macOS
        - Linux
        - iOS
        - Android
    validations:
      required: true

  - type: checkboxes
    id: checked
    attributes:
      label: 确认
      options:
        - label: 我看过 README 的 FAQ 与已知限制
          required: true
        - label: 我贴出的内容已脱敏
          required: true
